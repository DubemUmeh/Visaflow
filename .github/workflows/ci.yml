name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create root env file
        run: echo "DATABASE_URL=${DATABASE_URL}" > .env

      - name: Run database migrations
        run: pnpm --filter @visaflow/database db:migrate

      - name: Build database package
        run: pnpm --filter @visaflow/database build

      - name: Type check database package
        run: pnpm --filter @visaflow/database typecheck

      - name: Lint database package
        run: pnpm --filter @visaflow/database lint

      - name: Test database package
        run: pnpm --filter @visaflow/database test --passWithNoTests
